name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  COVERAGE_MIN_LINES: "80"
  # Server for #[sqlx::test], which creates a fresh database per test.
  DATABASE_URL: postgres://kanbot:kanbot@127.0.0.1:5432/kanbot
  # renovate: datasource=crate depName=sqlx-cli
  SQLX_CLI_VERSION: "0.9.1"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install sqlx-cli
        run: cargo install "sqlx-cli@$SQLX_CLI_VERSION" --locked --no-default-features --features postgres,rustls
      # The local stack of backend/AGENTS.md: Postgres, Authelia and
      # Keycloak (compose.yaml, images pinned by digest).
      - name: Local stack
        run: sh dev/local-stack.sh
      # The query check below describes every query against this database.
      - name: Migrate the database
        run: sqlx migrate run
      # Fails if a query changed without `cargo sqlx prepare` (.sqlx/ is stale).
      - name: Offline query data is up to date
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --check -- --all-targets --all-features
      - name: Tests with coverage threshold
        run: cargo llvm-cov --all-features --locked --fail-under-lines "$COVERAGE_MIN_LINES"

  # Every Cargo workspace, with backend/deny.toml. cargo-deny comes from
  # install-action, which checks its checksum.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - openshell-api/codegen/Cargo.toml
          - fuzz/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.22.0
      - name: cargo deny
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo deny --manifest-path "$MANIFEST" --all-features check

  # The fuzz targets are a workspace of their own (fuzz/Cargo.toml), which
  # the lint job does not reach. Fuzzing needs nightly and runs by hand;
  # building and linting the targets does not.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend/fuzz
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --bins -- -D warnings

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Committed migrations are unchanged
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --diff-filter=DMRT "origin/$BASE_REF...HEAD" -- 'migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Committed migrations must never change. Add a new migration instead (backend/AGENTS.md)."
            exit 1
          fi

  # The OpenShell client generated from the vendored .proto files
  # (openshell-api/README.md) is committed. Fails if it is stale.
  openshell-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend/openshell-api/codegen
      - name: Generated code is up to date
        run: |
          sh openshell-api/regenerate.sh
          if [ -n "$(git status --porcelain -- openshell-api)" ]; then
            git status --short -- openshell-api
            echo "::error::openshell-api/src/generated is stale. Run 'sh backend/openshell-api/regenerate.sh' and commit the result."
            exit 1
          fi

  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants@27.1.0
      # Mutants in database and authentication code are caught only by
      # tests that use the database and the local identity providers
      # (compose.yaml, images pinned by digest).
      - name: Local stack
        run: sh dev/local-stack.sh
      - name: Mutation-test changed code
        # --relative makes the paths relative to backend/, where cargo mutants
        # runs. With repo-root paths (backend/src/...) it matches no files and
        # passes without testing anything.
        # The base branch comes in through the environment: expanded in the
        # script, a crafted branch name could run code (zizmor).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --relative "origin/$BASE_REF...HEAD" -- . > "$RUNNER_TEMP/pr.diff"
          cargo mutants --no-shuffle --in-diff "$RUNNER_TEMP/pr.diff" -- --all-features
