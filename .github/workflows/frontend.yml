name: frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned SDK. Keep in step with the version used to develop locally.
  # renovate: datasource=flutter-version depName=flutter
  FLUTTER_VERSION: "3.50.0"

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Fails if pubspec.lock is missing or out of date with pubspec.yaml.
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      # Generated code (*.mocks.dart, the API client from ../backend/openapi.json)
      # is committed. Fails if it is stale.
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run tool/generate_api_client.dart
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --short -- .
            echo "::error::Generated code is out of date. Run 'dart run build_runner build --delete-conflicting-outputs' and 'dart run tool/generate_api_client.dart', and commit the result."
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test
      # The release web build (tool/build_web.dart): web compatibility of the
      # dependencies.
      - name: Release web build
        run: dart run tool/build_web.dart

  # Signs in on Linux desktop against the local stack: the real app, backend
  # and Authelia, with a stand-in system browser (integration_test/README.md).
  linux-sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - name: Linux desktop, virtual display and secret store
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb dbus gnome-keyring
      - name: Local stack
        working-directory: backend
        run: |
          echo "127.0.0.1 auth.kanbot.internal" | sudo tee -a /etc/hosts
          sh dev/auth-setup.sh
          docker compose up -d --wait
      - name: Backend
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
        run: |
          cargo build --locked --bin kanbot-backend --example dev-token
          set -a; . dev/dev.env; set +a
          ./target/debug/kanbot-backend migrate
          nohup ./target/debug/kanbot-backend >"$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://localhost:3000/ready >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ready
      - run: flutter pub get --enforce-lockfile
      - name: Sign in end to end
        run: sh integration_test/run_linux.sh
      - name: Scrolling performance (audit log, scripted server)
        run: xvfb-run -a flutter test integration_test/scroll_performance_test.dart -d linux
      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

