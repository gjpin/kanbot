name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static analysis of the workflows themselves: injection, credential
  # persistence, unpinned actions and the like.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=zizmorcore/zizmor
      ZIZMOR_VERSION: "1.32.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          # Fail the job on findings instead of uploading them to code scanning.
          advanced-security: false

  # Secrets in the whole history. Only the test-only signing keys are
  # allowed (.gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
      GITLEAKS_IMAGE: "v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          "ghcr.io/gitleaks/gitleaks:$GITLEAKS_IMAGE"
          git /repo --config /repo/.gitleaks.toml --redact --verbose
