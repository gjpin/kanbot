# Fuzz targets (cargo-fuzz). Run manually, on nightly; not part of CI.
# See README.md.
[package]
name = "kanbot-backend-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
kanbot-backend = { path = ".." }
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"

# Its own workspace, so the backend's builds never include it.
[workspace]
members = ["."]

[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_claims"
path = "fuzz_targets/signed_claims.rs"
test = false
doc = false
bench = false
