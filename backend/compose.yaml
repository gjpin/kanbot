# Local development services.
#
# What the tests need: `sh dev/auth-setup.sh`, then `docker compose up -d`.
#
# Database: export DATABASE_URL=postgres://kanbot:kanbot@127.0.0.1:5432/kanbot
# Tests (#[sqlx::test]) create and drop their own databases on this server.
#
# Identity provider: Authelia at https://auth.kanbot.internal:9443, which
# needs `127.0.0.1 auth.kanbot.internal` in /etc/hosts. dev/dev.env has the
# backend's OIDC_* settings for it.
#
# Observability (optional): `docker compose --profile observability up -d`
# adds an OpenTelemetry Collector with Grafana, Tempo (traces), Loki (logs)
# and Prometheus (metrics) at http://127.0.0.1:3001. The backend exports to
# its default OTLP endpoint, http://localhost:4318; to relay the app's
# telemetry too, run the backend with
#   TELEMETRY_RELAY_UPSTREAM=http://127.0.0.1:4318
services:
  postgres:
    image: postgres:18.7@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    environment:
      POSTGRES_USER: kanbot
      POSTGRES_PASSWORD: kanbot
      POSTGRES_DB: kanbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kanbot"]
      interval: 2s
      timeout: 5s
      retries: 15

  authelia:
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    environment:
      # Lets configuration.yml read the signing key from /secrets.
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
    volumes:
      - ./dev/authelia:/config:ro
      - ./dev/.generated:/secrets:ro
    # Sessions and consents do not outlive the container.
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:9443:9443"
    networks:
      default:
        aliases:
          - auth.kanbot.internal

  observability:
    profiles: [observability]
    image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    ports:
      - "127.0.0.1:3001:3000" # Grafana (3000 is the backend)
      - "127.0.0.1:4318:4318" # OTLP/HTTP
    volumes:
      - ./otel-collector/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro

volumes:
  postgres-data:
